# news-telegram 設定テンプレート
# 運用時は config/config.yaml にコピーして使用してください（認証情報は .env で管理）。

polling:
  interval_seconds: 300        # 定期実行間隔の目安（5分）
  max_articles_per_run: 1      # AI呼び出しが1〜3分かかるため1件固定（実測を反映）
  concurrency: 1               # 同時処理数（サイト負荷対策で1件固定推奨）

http:
  timeout_seconds: 15
  max_retries: 3
  retry_delays_seconds: [1, 3, 10]
  user_agent: "NewsTelegramPersonalBot/1.0 (+https://example.local)"

feeds:
  - name: "Yahoo!ニュース ITトピックス"
    url: "https://news.yahoo.co.jp/rss/topics/it.xml"
    enabled: true
  - name: "Yahoo!ニュース ITmedia配信"
    url: "https://news.yahoo.co.jp/rss/media/zdn_n/all.xml"
    enabled: true
  - name: "ITmedia NEWS"
    url: "https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml"
    enabled: true
  # 追加候補（2026-11-27 実確認）: 公式RSSが当日更新されており、本文抽出も汎用 selector で可能なIT系媒体。
  - name: "GIGAZINE"
    url: "https://gigazine.net/news/rss_2.0/"
    enabled: true
  - name: "PC Watch"
    url: "https://pc.watch.impress.co.jp/data/rss/1.0/pcw/feed.rdf"
    enabled: true
  - name: "AV Watch"
    url: "https://av.watch.impress.co.jp/data/rss/1.0/avw/feed.rdf"
    enabled: true
  - name: "デジカメ Watch"
    url: "https://dc.watch.impress.co.jp/data/rss/1.0/dcw/feed.rdf"
    enabled: true
  - name: "GAME Watch"
    url: "https://game.watch.impress.co.jp/data/rss/1.0/gmw/feed.rdf"
    enabled: true
  - name: "ケータイ Watch"
    url: "https://k-tai.watch.impress.co.jp/data/rss/1.0/ktw/feed.rdf"
    enabled: true
  - name: "INTERNET Watch"
    url: "https://internet.watch.impress.co.jp/data/rss/1.0/iw/feed.rdf"
    enabled: true

content:
  min_chars_guideline: 400     # 本文文字数の目安（短い記事はレビュー判定併用）
  max_summary_lines: 1         # iPhone通知で3行以内になるよう1行にまとめる（改行なし）
  max_summary_chars: 60        # iPhone通知で3行以内になる上限（目標50〜60文字、改行なし・重要キーワード優先）

ai:
  provider: "apple_intelligence_shortcuts"
  summarize_shortcut: "News_Summarize"
  review_shortcut: "News_Review"
  timeout_seconds: 240         # 実測: 要約97秒 / レビュー193秒。プロセス終了後の出力待ちを含む
  cooldown_seconds: 900        # 混雑（現在、リクエストを完了できません）時にAI呼び出しを止める時間
  # 品質基準を満たすまで再生成・再レビューを繰り返す（外部障害時は即フェイルクローズ）
  max_summary_attempts: 60     # 要約生成の最大試行回数
  max_revision_attempts: 60    # レビュー不合格時の修正・再レビューの最大回数

telegram:
  disable_web_page_preview: true
  max_retries: 3
  retry_delays_seconds: [1, 3, 10]

paths:
  database: "data/news.db"
  log_file: "logs/application.log"
